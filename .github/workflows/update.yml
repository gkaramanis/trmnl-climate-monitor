name: Update climate data

on:
  schedule:
    # Every 6h. GitHub queues scheduled runs on shared runners and has been
    # firing these 2–3.5h late, so treat the times below as "no earlier than".
    # Four slots mean a poll landing at any hour finds data a few hours old at
    # worst, instead of depending on one drifty daily run.
    - cron: "20 2,8,14,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data.json
        # Config (location, units, normal window) lives at the top of
        # build_data.py — that's the single source of truth. Override per-run
        # locally with env vars if needed, e.g. LAT=51.5 python3 build_data.py.
        run: python build_data.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update climate data $(date -u +%F)"
          git push
